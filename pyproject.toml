[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelops"
version = "0.1.0"
description = "CLI for inspecting, validating, and comparing AI model metadata."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
modelops = "modelops.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
